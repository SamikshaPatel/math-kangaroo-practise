<!DOCTYPE html>
<html lang="en">
<head>
<title>Admin Dashboard · Math Kangaroo</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦘</text></svg>">
<style>
:root {
  --primary: #2563eb;
  --primary-light: #dbeafe;
  --success: #10b981;
  --success-light: #d1fae5;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --orange: #ea580c;
  --orange-light: #ffedd5;
  --gray-light: #f3f4f6;
  --gray-lighter: #f9fafb;
  --gray-medium: #9ca3af;
  --gray-dark: #374151;
  --text-primary: #1f2937;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --bg-body: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #3b82f6;
    --primary-light: #1e3a8a;
    --success: #059669;
    --success-light: #064e3b;
    --warning: #d97706;
    --warning-light: #78350f;
    --orange: #c2410c;
    --orange-light: #431407;
    --gray-light: #2d3748;
    --gray-lighter: #1a202c;
    --gray-medium: #6b7280;
    --gray-dark: #f3f4f6;
    --text-primary: #f3f4f6;
    --text-secondary: #d1d5db;
    --border: #4b5563;
    --bg-body: #111827;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-body);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  padding: 16px;
}
.container { max-width: 1400px; margin: 0 auto; }
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
  flex-wrap: wrap;
  gap: 12px;
}
.page-header h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}
.page-header .back-link {
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}
.page-header .back-link:hover { text-decoration: underline; }

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 24px;
}
.tab-btn {
  padding: 10px 20px;
  border: none;
  background: none;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color .15s, border-color .15s;
}
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.tab-btn:hover:not(.active) { color: var(--text-primary); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Loading / Error ── */
#auth-loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-secondary);
  font-size: 16px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Progress table ── */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 400px;
}
thead th {
  background: var(--gray-lighter);
  padding: 10px 14px;
  text-align: left;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: .5px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th:not(:first-child) { text-align: center; }
tbody td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--gray-lighter); }

/* summary row */
.summary-row td {
  background: var(--primary-light);
  font-weight: 700;
  font-size: 12px;
  color: var(--primary);
}
.summary-row:hover td { background: var(--primary-light) !important; }

/* module label col */
td.module-label {
  font-weight: 600;
  white-space: nowrap;
  color: var(--text-primary);
}
td.cell-center { text-align: center; }

/* cell states */
.cell-none {
  color: var(--gray-medium);
  font-weight: 500;
}
.cell-inprogress {
  display: inline-block;
  background: var(--warning-light);
  color: #92400e;
  font-weight: 700;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
}
.cell-perfect {
  display: inline-block;
  background: var(--success-light);
  color: #065f46;
  font-weight: 700;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
}
.cell-partial {
  display: inline-block;
  background: var(--orange-light);
  color: #7c2d12;
  font-weight: 700;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
}
@media (prefers-color-scheme: dark) {
  .cell-inprogress { color: #fef3c7; }
  .cell-perfect    { color: #d1fae5; }
  .cell-partial    { color: #fed7aa; }
  .summary-row td  { color: #93c5fd; }
}

/* ── Manage Kids ── */
.kids-list { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
.kid-row {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  background: var(--gray-lighter);
}
.kid-row-header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.kid-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 13px;
}
.kid-name { font-weight: 700; font-size: 15px; flex: 1; }
.btn-edit {
  padding: 5px 14px;
  border: 1.5px solid var(--border);
  background: var(--bg-body);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: var(--primary);
  transition: background .15s, border-color .15s;
}
.btn-edit:hover { background: var(--primary-light); border-color: var(--primary); }

.edit-form {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.edit-form.open { display: block; }
.edit-form label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
  margin-top: 10px;
}
.edit-form label:first-child { margin-top: 0; }
.edit-form input[type="text"] {
  width: 100%;
  padding: 7px 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  background: var(--bg-body);
  color: var(--text-primary);
  font-family: inherit;
}
.edit-form input[type="text"]:focus {
  outline: none;
  border-color: var(--primary);
}
.color-picker-wrap {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.color-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform .15s, border-color .15s;
}
.color-swatch.selected {
  border-color: var(--text-primary);
  transform: scale(1.15);
}
.edit-form-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
/* PDF access toggles */
.pdf-access-row {
  display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px;
}
.pdf-toggle-item {
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
}
.toggle-switch {
  position: relative; width: 40px; height: 22px; flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0; background: var(--border);
  border-radius: 99px; cursor: pointer; transition: background .2s;
}
.toggle-switch input:checked + .toggle-track { background: var(--success); }
.toggle-track::before {
  content: ''; position: absolute; width: 16px; height: 16px;
  left: 3px; top: 3px; background: #fff; border-radius: 50%;
  transition: transform .2s;
}
.toggle-switch input:checked + .toggle-track::before { transform: translateX(18px); }
.btn-save {
  padding: 7px 18px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s;
}
.btn-save:hover { background: #1d4ed8; }
.btn-save:disabled { opacity: .6; cursor: not-allowed; }
.btn-cancel {
  padding: 7px 14px;
  background: none;
  color: var(--text-secondary);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.btn-cancel:hover { border-color: var(--gray-medium); }
.save-status {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  display: none;
}
.save-status.ok { background: var(--success-light); color: #065f46; display: inline-block; }
.save-status.err { background: #fee2e2; color: #991b1b; display: inline-block; }

.manage-note {
  margin-top: 20px;
  padding: 12px 16px;
  background: var(--gray-lighter);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  max-width: 560px;
}
.manage-note strong { color: var(--text-primary); }

/* Add Kid form */
.btn-add-kid {
  padding: 8px 18px;
  background: var(--success);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s;
}
.btn-add-kid:hover { background: #047857; }
.add-kid-card {
  display: none;
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 16px;
  max-width: 560px;
  margin-bottom: 12px;
  background: var(--gray-lighter);
}
.add-kid-card.open { display: block; }
.add-kid-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }

/* Delete button */
.btn-delete {
  padding: 5px 12px;
  border: 1.5px solid #fca5a5;
  background: var(--bg-body);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: #dc2626;
  transition: background .15s;
}
.btn-delete:hover { background: #fee2e2; }

/* ── Refresh btn ── */
.section-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.section-actions h2 { font-size: 17px; font-weight: 700; flex: 1; }
.btn-refresh {
  padding: 6px 14px;
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
}
.btn-refresh:hover { background: var(--primary-light); }
.load-note { font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="container">

  <!-- Auth loading overlay -->
  <div id="auth-loading">
    <div class="spinner"></div>
    Checking admin access…
  </div>

  <!-- Main content (hidden until auth passes) -->
  <div id="main-content" style="display:none;">
    <div class="page-header">
      <div>
        <a href="index.html" class="back-link">← Back to Home</a>
        <h1 style="margin-top:4px;">Admin Dashboard</h1>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('progress')">Progress</button>
      <button class="tab-btn" onclick="switchTab('kids')">Manage Kids</button>
    </div>

    <!-- Progress Tab -->
    <div id="tab-progress" class="tab-panel active">
      <div class="section-actions">
        <h2>Module Progress by Kid</h2>
        <button class="btn-refresh" onclick="loadProgressData()">↻ Refresh</button>
        <span class="load-note" id="progress-load-note"></span>
      </div>
      <div id="progress-content">
        <div style="color:var(--text-secondary);padding:20px 0;">Loading progress data…</div>
      </div>
    </div>

    <!-- Manage Kids Tab -->
    <div id="tab-kids" class="tab-panel">
      <div class="section-actions">
        <h2>Kids</h2>
        <button class="btn-add-kid" onclick="toggleAddKidForm()">+ Add Kid</button>
      </div>

      <!-- Add Kid Form -->
      <div class="add-kid-card" id="add-kid-card">
        <h3>Add New Kid</h3>
        <label class="edit-form" style="display:block;">
          <span style="font-size:12px;font-weight:600;color:var(--text-secondary);">Name</span>
          <input type="text" id="new-kid-name" placeholder="e.g. Arjun" maxlength="40"
                 style="width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;background:var(--bg-body);color:var(--text-primary);font-family:inherit;margin-top:4px;">
        </label>
        <div style="margin-top:10px;">
          <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;">Color</div>
          <div class="color-picker-wrap" id="new-kid-colors">
            <!-- swatches injected by JS -->
          </div>
          <input type="hidden" id="new-kid-color" value="#2563eb">
        </div>
        <div style="margin-top:10px;">
          <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;">Passcode (min 4 chars)</div>
          <input type="password" id="new-kid-passcode" placeholder="••••••" maxlength="8"
                 style="width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:20px;font-weight:700;letter-spacing:6px;background:var(--bg-body);color:var(--text-primary);font-family:inherit;">
        </div>
        <div class="edit-form-actions" style="margin-top:14px;">
          <button class="btn-save" id="add-kid-btn" onclick="addKid()">Add Kid</button>
          <button class="btn-cancel" onclick="toggleAddKidForm()">Cancel</button>
          <span class="save-status" id="add-kid-status"></span>
        </div>
      </div>

      <div id="kids-content">
        <div style="color:var(--text-secondary);padding:20px 0;">Loading kids…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase_client.js"></script>
<script src="profile.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────
const COLOR_PALETTE = [
  '#2563eb','#7c3aed','#db2777','#dc2626',
  '#d97706','#059669','#0891b2','#65a30d',
  '#374151','#f97316',
];

// ─────────────────────────────────────────────────────────────
// AUTH CHECK
// ─────────────────────────────────────────────────────────────
async function checkAdminAccess() {
  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) { redirectOut(); return; }

    // Primary check: email — avoids RLS issues on initial load
    const isAdminEmail = session.user.email === 'admin@mathkangaroo.app';
    if (!isAdminEmail) { redirectOut(); return; }

    // Fetch admin's kids row for display info (non-fatal if it fails)
    const { data: kid } = await sbClient
      .from('kids')
      .select('id, name, color, is_admin')
      .eq('auth_id', session.user.id)
      .maybeSingle();

    setActiveProfile((kid && kid.name) || 'Admin');
    setActiveKidId(kid ? kid.id : null);
    setActiveKidColor((kid && kid.color) || '#374151');

    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    injectProfileChip();

    loadProgressData();
    loadKidsData();
  } catch(e) {
    redirectOut();
  }
}

function redirectOut() {
  window.location.replace('index.html');
}

// ─────────────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    const panels = ['progress','kids'];
    b.classList.toggle('active', panels[i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'tab-' + name);
  });
}

// ─────────────────────────────────────────────────────────────
// PROGRESS TAB
// ─────────────────────────────────────────────────────────────
async function loadProgressData() {
  const note = document.getElementById('progress-load-note');
  const container = document.getElementById('progress-content');
  note.textContent = 'Loading…';
  container.innerHTML = '<div style="color:var(--text-secondary);padding:20px 0;">Loading…</div>';

  try {
    // Force a fresh token in case session was swapped between kid/admin logins
    await sbClient.auth.refreshSession();

    // Fetch non-admin kids
    const { data: kids, error: kErr } = await sbClient
      .from('kids')
      .select('id, name, color')
      .eq('is_admin', false)
      .order('name');
    if (kErr) throw kErr;

    // Fetch all attempts
    const { data: attempts, error: aErr } = await sbClient
      .from('attempts')
      .select('kid_id, grade, sub, correct_count, total_questions, completed_at')
      .order('completed_at', { ascending: true });
    if (aErr) throw aErr;

    // Fetch all in-progress records
    const { data: progRows, error: pErr } = await sbClient
      .from('progress')
      .select('kid_id, grade, sub, answers');
    if (pErr) throw pErr;

    note.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    renderProgressTable(kids, attempts, progRows);
  } catch(e) {
    note.textContent = '';
    container.innerHTML = `<div style="color:#dc2626;padding:20px 0;">Error loading data: ${e.message}</div>`;
  }
}

function renderProgressTable(kids, attempts, progRows) {
  const container = document.getElementById('progress-content');
  if (!kids || kids.length === 0) {
    container.innerHTML = '<div style="color:var(--text-secondary);padding:20px 0;">No kids found.</div>';
    return;
  }

  // Collect all modules mentioned in attempts or progress
  const moduleSet = new Set();
  (attempts || []).forEach(a => moduleSet.add(`${a.grade}|${a.sub}`));
  (progRows  || []).forEach(p => moduleSet.add(`${p.grade}|${p.sub}`));

  // Sort modules: grade first, then sub numerically
  const modules = Array.from(moduleSet).sort((a, b) => {
    const [ga, sa] = a.split('|');
    const [gb, sb] = b.split('|');
    if (ga !== gb) return ga.localeCompare(gb);
    return parseFloat(sa) - parseFloat(sb);
  });

  // Build lookup: { `kidId|grade|sub` → { attempts:[], hasProgress:bool } }
  const lookup = {};
  function key(kidId, grade, sub) { return `${kidId}|${grade}|${sub}`; }

  (attempts || []).forEach(a => {
    const k = key(a.kid_id, a.grade, a.sub);
    if (!lookup[k]) lookup[k] = { attempts: [], hasProgress: false };
    lookup[k].attempts.push(a);
  });
  (progRows || []).forEach(p => {
    const k = key(p.kid_id, p.grade, p.sub);
    if (!lookup[k]) lookup[k] = { attempts: [], hasProgress: false };
    // hasProgress = has at least one non-null answer saved
    if (p.answers && Array.isArray(p.answers) && p.answers.some(a => a !== null)) {
      lookup[k].hasProgress = true;
    }
  });

  // Per-kid summary
  const summaryStarted  = {};
  const summaryPerfect  = {};
  const summaryAttempts = {};
  kids.forEach(k => {
    summaryStarted[k.id]  = 0;
    summaryPerfect[k.id]  = 0;
    summaryAttempts[k.id] = 0;
  });
  modules.forEach(mod => {
    const [grade, sub] = mod.split('|');
    kids.forEach(k => {
      const entry = lookup[key(k.id, grade, sub)];
      if (!entry) return;
      const hasAttempts = entry.attempts.length > 0;
      const hasProg = entry.hasProgress;
      if (hasAttempts || hasProg) summaryStarted[k.id]++;
      if (hasAttempts) summaryAttempts[k.id] += entry.attempts.length;
      if (hasAttempts && entry.attempts.some(a => a.correct_count === a.total_questions)) {
        summaryPerfect[k.id]++;
      }
    });
  });

  // Grade label helper
  function gradeLabel(g) {
    if (g === '34') return 'Grade 3-4';
    if (g === '56') return 'Grade 5-6';
    return 'Grade ' + g;
  }

  let html = '<div class="table-wrap"><table><thead><tr>';
  html += '<th>Module</th>';
  kids.forEach(k => {
    html += `<th>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${k.color || '#9ca3af'};display:inline-block;flex-shrink:0;"></span>
        ${escHtml(k.name)}
      </div>
    </th>`;
  });
  html += '</tr>';

  // Summary row
  html += '<tr class="summary-row"><td class="module-label">Summary</td>';
  kids.forEach(k => {
    html += `<td class="cell-center" style="font-size:12px;">
      ${summaryStarted[k.id]} modules · ${summaryAttempts[k.id]} attempts · ${summaryPerfect[k.id]} perfect
    </td>`;
  });
  html += '</tr></thead><tbody>';

  // Module rows
  modules.forEach(mod => {
    const [grade, sub] = mod.split('|');
    html += `<tr>
      <td class="module-label">${gradeLabel(grade)} · ${escHtml(sub)}</td>`;
    kids.forEach(k => {
      html += '<td class="cell-center">';
      const entry = lookup[key(k.id, grade, sub)];
      if (!entry || (entry.attempts.length === 0 && !entry.hasProgress)) {
        html += '<span class="cell-none">–</span>';
      } else if (entry.attempts.length === 0 && entry.hasProgress) {
        html += '<span class="cell-inprogress">In Progress</span>';
      } else {
        // Has attempts — show each one
        const sorted = [...entry.attempts].sort((a, b) => a.attempt_num - b.attempt_num);
        const lines = sorted.map((a, idx) => {
          const total = a.total_questions || 50;
          const isPerfect = a.correct_count === total;
          const label = `#${a.attempt_num ?? idx + 1}`;
          const score = `${a.correct_count}/${total}`;
          const cls   = isPerfect ? 'cell-perfect' : 'cell-partial';
          return `<span class="${cls}" style="display:block;margin:2px 0;">${label}: ${score}</span>`;
        });
        if (entry.hasProgress) {
          lines.push(`<span class="cell-inprogress" style="display:block;margin:2px 0;">In Progress</span>`);
        }
        html += lines.join('');
      }
      html += '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────
// MANAGE KIDS TAB
// ─────────────────────────────────────────────────────────────
let allKids = [];

async function loadKidsData() {
  const container = document.getElementById('kids-content');
  try {
    const { data: kids, error } = await sbClient
      .from('kids')
      .select('id, name, color, is_admin, pdf_access_34, pdf_access_56')
      .eq('is_admin', false)
      .order('name');
    if (error) throw error;
    allKids = kids || [];
    renderKidsList(allKids);
  } catch(e) {
    container.innerHTML = `<div style="color:#dc2626;padding:20px 0;">Error: ${e.message}</div>`;
  }
}

function renderKidsList(kids) {
  const container = document.getElementById('kids-content');
  if (kids.length === 0) {
    container.innerHTML = '<div style="color:var(--text-secondary);padding:20px 0;">No kids found.</div>';
    return;
  }
  const listHtml = kids.map(k => buildKidRow(k)).join('');
  container.innerHTML = `<div class="kids-list">${listHtml}</div>`;

  // Attach color swatch listeners
  kids.forEach(k => {
    const swatches = document.querySelectorAll(`[data-kid-id="${k.id}"] .color-swatch`);
    swatches.forEach(sw => {
      sw.addEventListener('click', () => {
        swatches.forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
        // Update the hidden input
        const colorInput = document.querySelector(`[data-kid-id="${k.id}"] input[name="color"]`);
        if (colorInput) colorInput.value = sw.dataset.color;
      });
    });
  });
}

function buildKidRow(k) {
  const color = k.color || '#9ca3af';
  const initial = (k.name || '?')[0].toUpperCase();
  const swatchesHtml = COLOR_PALETTE.map(c => `
    <div class="color-swatch ${c === color ? 'selected' : ''}"
         style="background:${c};"
         data-color="${c}"
         title="${c}"></div>
  `).join('');

  return `
    <div class="kid-row" data-kid-id="${k.id}">
      <div class="kid-row-header">
        <div class="kid-dot" style="background:${color};">${initial}</div>
        <span class="kid-name" id="display-name-${k.id}">${escHtml(k.name)}</span>
        <button class="btn-edit" onclick="toggleEditForm('${k.id}')">Edit</button>
        <button class="btn-edit" onclick="togglePasscodeForm('${k.id}')">🔑 Passcode</button>
        <button class="btn-delete" onclick="deleteKid('${k.id}', '${escHtml(k.name)}')">Delete</button>
      </div>
      <div style="margin-top:10px;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:6px;">PDF Access</div>
        <div class="pdf-access-row">
          <div class="pdf-toggle-item">
            <label class="toggle-switch">
              <input type="checkbox" ${k.pdf_access_34 ? 'checked' : ''}
                     onchange="savePdfAccess('${k.id}', '34', this.checked)">
              <span class="toggle-track"></span>
            </label>
            Grades 3–4
          </div>
          <div class="pdf-toggle-item">
            <label class="toggle-switch">
              <input type="checkbox" ${k.pdf_access_56 ? 'checked' : ''}
                     onchange="savePdfAccess('${k.id}', '56', this.checked)">
              <span class="toggle-track"></span>
            </label>
            Grades 5–6
          </div>
        </div>
      </div>
      <div class="edit-form" id="edit-form-${k.id}">
        <label>Display Name</label>
        <input type="text" name="name" value="${escHtml(k.name)}" placeholder="Name" maxlength="40">
        <label>Color</label>
        <div class="color-picker-wrap">
          ${swatchesHtml}
          <input type="hidden" name="color" value="${color}">
        </div>
        <div class="edit-form-actions">
          <button class="btn-save" onclick="saveKid('${k.id}')">Save</button>
          <button class="btn-cancel" onclick="toggleEditForm('${k.id}')">Cancel</button>
          <span class="save-status" id="save-status-${k.id}"></span>
        </div>
      </div>
      <div class="edit-form" id="passcode-form-${k.id}">
        <label>New Passcode for ${escHtml(k.name)}</label>
        <input type="password" name="new_passcode" placeholder="Min 4 characters" maxlength="8"
               style="letter-spacing:6px;font-size:20px;font-weight:700;">
        <div class="edit-form-actions">
          <button class="btn-save" onclick="savePasscode('${k.id}', '${escHtml(k.name)}')">Update</button>
          <button class="btn-cancel" onclick="togglePasscodeForm('${k.id}')">Cancel</button>
          <span class="save-status" id="passcode-status-${k.id}"></span>
        </div>
      </div>
    </div>
  `;
}

function toggleEditForm(kidId) {
  const form = document.getElementById('edit-form-' + kidId);
  if (!form) return;
  form.classList.toggle('open');
}

function togglePasscodeForm(kidId) {
  const form = document.getElementById('passcode-form-' + kidId);
  if (!form) return;
  form.classList.toggle('open');
  if (form.classList.contains('open')) {
    const input = form.querySelector('input[name="new_passcode"]');
    if (input) { input.value = ''; setTimeout(() => input.focus(), 50); }
  }
}

async function savePasscode(kidId, kidName) {
  const form   = document.getElementById('passcode-form-' + kidId);
  const input  = form.querySelector('input[name="new_passcode"]');
  const btn    = form.querySelector('.btn-save');
  const status = document.getElementById('passcode-status-' + kidId);

  const newPasscode = (input.value || '').trim();
  if (newPasscode.length < 4) {
    showStatus(status, 'Min 4 characters', 'err'); return;
  }

  btn.disabled = true;
  btn.textContent = 'Updating…';

  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) throw new Error('Not authenticated');

    const res = await fetch(
      'https://dlwbedohwifrxuxvijrp.supabase.co/functions/v1/update-passcode',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ kid_name: kidName, new_passcode: newPasscode }),
      }
    );
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Failed');

    showStatus(status, '✓ Passcode updated!', 'ok');
    input.value = '';
    setTimeout(() => {
      togglePasscodeForm(kidId);
      status.className = 'save-status';
    }, 1500);
  } catch(e) {
    showStatus(status, 'Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Update';
  }
}

async function saveKid(kidId) {
  const row = document.querySelector(`[data-kid-id="${kidId}"]`);
  if (!row) return;
  const nameInput  = row.querySelector('input[name="name"]');
  const colorInput = row.querySelector('input[name="color"]');
  const btn        = row.querySelector('.btn-save');
  const status     = document.getElementById('save-status-' + kidId);

  const newName  = (nameInput.value || '').trim();
  const newColor = colorInput.value || '#2563eb';

  if (!newName) { showStatus(status, 'Name cannot be empty', 'err'); return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';
  status.className = 'save-status';
  status.style.display = 'none';

  try {
    const { error } = await sbClient
      .from('kids')
      .update({ name: newName, color: newColor })
      .eq('id', kidId);
    if (error) throw error;

    // Update local cache & display
    const kid = allKids.find(k => k.id === kidId);
    if (kid) { kid.name = newName; kid.color = newColor; }
    const displayName = document.getElementById('display-name-' + kidId);
    if (displayName) displayName.textContent = newName;
    // Update dot color
    const dot = row.querySelector('.kid-dot');
    if (dot) { dot.style.background = newColor; dot.textContent = newName[0].toUpperCase(); }

    showStatus(status, 'Saved!', 'ok');
    setTimeout(() => {
      toggleEditForm(kidId);
      status.className = 'save-status';
    }, 1200);
  } catch(e) {
    showStatus(status, 'Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

function showStatus(el, msg, type) {
  el.textContent = msg;
  el.className = 'save-status ' + type;
}

// ─────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─────────────────────────────────────────────────────────────
// ADD KID
// ─────────────────────────────────────────────────────────────
function toggleAddKidForm() {
  const card = document.getElementById('add-kid-card');
  const isOpen = card.classList.toggle('open');
  if (isOpen) {
    // Populate color swatches
    const wrap = document.getElementById('new-kid-colors');
    const hiddenInput = document.getElementById('new-kid-color');
    wrap.innerHTML = COLOR_PALETTE.map((c, i) => `
      <div class="color-swatch ${i === 0 ? 'selected' : ''}"
           style="background:${c};" data-color="${c}" title="${c}"></div>
    `).join('');
    hiddenInput.value = COLOR_PALETTE[0];
    wrap.querySelectorAll('.color-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        wrap.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
        hiddenInput.value = sw.dataset.color;
      });
    });
    document.getElementById('new-kid-name').value = '';
    document.getElementById('new-kid-passcode').value = '';
    document.getElementById('add-kid-status').className = 'save-status';
    setTimeout(() => document.getElementById('new-kid-name').focus(), 50);
  }
}

async function addKid() {
  const name     = (document.getElementById('new-kid-name').value || '').trim();
  const color    = document.getElementById('new-kid-color').value;
  const passcode = (document.getElementById('new-kid-passcode').value || '').trim();
  const btn      = document.getElementById('add-kid-btn');
  const status   = document.getElementById('add-kid-status');

  if (!name)            { showStatus(status, 'Name is required', 'err'); return; }
  if (passcode.length < 4) { showStatus(status, 'Passcode min 4 chars', 'err'); return; }

  btn.disabled = true;
  btn.textContent = 'Adding…';
  status.className = 'save-status';

  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) throw new Error('Not authenticated');

    const res = await fetch(
      'https://dlwbedohwifrxuxvijrp.supabase.co/functions/v1/create-kid',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ name, color, passcode }),
      }
    );
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Failed');

    showStatus(status, '✓ Kid added!', 'ok');
    setTimeout(() => {
      toggleAddKidForm();
      loadKidsData();
      loadProgressData();
    }, 1000);
  } catch(e) {
    showStatus(status, 'Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add Kid';
  }
}

// ─────────────────────────────────────────────────────────────
// DELETE KID
// ─────────────────────────────────────────────────────────────
async function deleteKid(kidId, kidName) {
  if (!confirm(`Delete ${kidName}? This will permanently remove their account and all progress data.`)) return;

  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) throw new Error('Not authenticated');

    const res = await fetch(
      'https://dlwbedohwifrxuxvijrp.supabase.co/functions/v1/delete-kid',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ kid_id: kidId }),
      }
    );
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Failed');

    loadKidsData();
    loadProgressData();
  } catch(e) {
    alert('Error deleting kid: ' + e.message);
  }
}

// ─────────────────────────────────────────────────────────────
// PDF ACCESS TOGGLE
// ─────────────────────────────────────────────────────────────
async function savePdfAccess(kidId, grade, enabled) {
  const col = grade === '34' ? 'pdf_access_34' : 'pdf_access_56';
  try {
    const { error } = await sbClient.from('kids').update({ [col]: enabled }).eq('id', kidId);
    if (error) throw error;
    const kid = allKids.find(k => k.id === kidId);
    if (kid) kid[col] = enabled;
  } catch(e) {
    alert('Error saving PDF access: ' + e.message);
  }
}
