<meta charset="utf-8">

<style>
:root {
  --primary: #2563eb;

  --bg-body: #ffffff;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #3b82f6;
    --primary-light: #1e3a8a;
    --gray-light: #2d3748;
    --gray-lighter: #1a202c;
    --gray-medium: #6b7280;
    --text-primary: #f3f4f6;
    --text-secondary: #d1d5db;
    --border: #4b5563;
    --bg-body: #111827;
  }
}

:root[data-theme="dark"] {
  --primary: #3b82f6;
  --primary-light: #1e3a8a;
  --gray-light: #2d3748;
  --gray-lighter: #1a202c;
  --gray-medium: #6b7280;
  --text-primary: #f3f4f6;
  --text-secondary: #d1d5db;
  --border: #4b5563;

}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-body);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.container {
  max-width: 520px;
  width: 100%;
  text-align: center;
}

.icon { font-size: 56px; margin-bottom: 20px; }

h1 {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 10px;
}

.grade-label {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

p {
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 32px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--primary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border: 1px solid var(--primary);
  padding: 8px 20px;
  border-radius: 8px;
  transition: background 0.15s;
}

.back-link:hover {
  background: var(--primary-light);
}
