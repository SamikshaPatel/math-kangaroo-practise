<!DOCTYPE html>
<html lang="en">
<head>
<title>Data Migration</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: monospace; max-width: 640px; margin: 40px auto; padding: 24px; background: #f9fafb; }
  h2   { margin-bottom: 16px; }
  pre  { background: #1f2937; color: #f3f4f6; padding: 16px; border-radius: 8px; overflow: auto; font-size: 13px; max-height: 400px; }
  button { padding: 12px 28px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 16px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .ok  { color: #10b981; font-weight: 700; }
  .err { color: #ef4444; font-weight: 700; }
</style>
</head>
<body>
<h2>🦘 One-time Data Migration</h2>
<p>This migrates Nivaan and Anishka's localStorage progress into Supabase.<br>
<strong>Run once, then delete this file.</strong></p>
<br>
<button id="btn" onclick="runMigration()">Run Migration</button>
<pre id="log">Ready. Click Run Migration to start.</pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase_client.js"></script>
<script>
const log = document.getElementById('log');
function out(msg, type) {
  const span = document.createElement('span');
  span.className = type || '';
  span.textContent = msg + '\n';
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

async function runMigration() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  log.textContent = '';

  // ── Get kid IDs ──────────────────────────────────────────────
  out('Fetching kid IDs from DB...');
  const { data: kids, error: kErr } = await sbClient.from('kids').select('id, name');
  if (kErr) { out('ERROR: ' + kErr.message, 'err'); btn.disabled = false; return; }

  const kidMap = {};
  kids.forEach(k => kidMap[k.name] = k.id);
  out('Kids found: ' + Object.keys(kidMap).join(', '), 'ok');

  const nivaan  = kidMap['Nivaan'];
  const anishka = kidMap['Anishka'];
  if (!nivaan || !anishka) {
    out('ERROR: Could not find Nivaan or Anishka in DB.', 'err');
    btn.disabled = false; return;
  }

  let ok = 0, fail = 0;

  async function insertAttempt(data) {
    const { error } = await sbClient.from('attempts').insert(data);
    if (error) { out('  FAIL: ' + error.message, 'err'); fail++; }
    else { out('  OK: attempt inserted', 'ok'); ok++; }
  }

  async function insertProgress(data) {
    const { error } = await sbClient.from('progress').upsert(data, { onConflict: 'kid_id,grade,sub' });
    if (error) { out('  FAIL: ' + error.message, 'err'); fail++; }
    else { out('  OK: progress inserted', 'ok'); ok++; }
  }

  // ── Nivaan · Grade 3-4 · 1.1 · 50/50 ───────────────────────
  out('\nInserting Nivaan — Grade 3-4 · 1.1 (50/50)...');
  await insertAttempt({
    kid_id: nivaan, grade: '34', sub: '1.1', attempt_num: 1,
    answers: [2,2,1,2,1,2,1,2,3,1,3,2,2,3,2,2,1,2,2,2,2,3,0,2,2,2,2,2,2,2,1,2,2,2,3,1,2,2,2,2,1,2,2,3,2,2,3,2,1,3],
    correct_count: 50, total_questions: 50,
    started_at:  '2026-09-24T00:25:05Z',
    completed_at:'2026-09-24T01:21:41Z',
  });

  // ── Nivaan · Grade 3-4 · 1.2 · 44/50 ───────────────────────
  out('\nInserting Nivaan — Grade 3-4 · 1.2 (44/50)...');
  await insertAttempt({
    kid_id: nivaan, grade: '34', sub: '1.2', attempt_num: 1,
    answers: [2,2,2,3,0,2,3,2,3,2,1,2,2,3,3,2,1,3,3,2,2,2,1,2,1,2,2,2,4,2,2,4,3,2,1,1,2,2,2,2,2,2,3,1,1,3,3,3,2,1],
    correct_count: 44, total_questions: 50,
    started_at:  '2026-09-24T02:03:02Z',
    completed_at:'2026-09-24T02:05:48Z',
  });

  // ── Anishka · Grade 3-4 · 1.1 · In progress (30/50) ────────
  out('\nInserting Anishka — Grade 3-4 · 1.1 (in progress, 30/50)...');
  await insertProgress({
    kid_id: anishka, grade: '34', sub: '1.1',
    answers: [2,2,1,2,1,2,1,2,3,1,3,2,2,3,0,2,1,1,2,2,2,3,0,2,2,2,2,2,2,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
    checked: [true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false],
    last_updated: '2026-09-24T00:00:00Z',
  });

  // ── Anishka · Grade 5-6 · 1.1 · In progress (5/50) ─────────
  out('\nInserting Anishka — Grade 5-6 · 1.1 (in progress, 5/50)...');
  await insertProgress({
    kid_id: anishka, grade: '56', sub: '1.1',
    answers: [2,1,1,2,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
    checked: [true,true,true,true,true,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false],
    last_updated: '2026-09-24T00:00:00Z',
  });

  // ── Anishka · Grade 5-6 · 4.2 · In progress (1/50) ─────────
  out('\nInserting Anishka — Grade 5-6 · 4.2 (in progress, 1/50)...');
  await insertProgress({
    kid_id: anishka, grade: '56', sub: '4.2',
    answers: [2,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
    checked: [true,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false,false],
    last_updated: '2026-09-24T00:00:00Z',
  });

  out('\n─────────────────────────────────');
  out(`Done. ${ok} succeeded, ${fail} failed.`, fail > 0 ? 'err' : 'ok');
  if (fail === 0) out('You can now delete migrate.html', 'ok');
  btn.disabled = false;
}
</script>
</body>
</html>
